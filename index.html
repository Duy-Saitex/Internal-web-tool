<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Gifts · Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Playfair+Display:wght@400..700&display=swap">
<style>
  :root{
    --paper:#1c2127; --ink:#f6f7f9; --ink-soft:#abb3bf;
    --g1a:#1b2a40; --g1b:#14233a; --g1accent:#8abbff;
    --g2a:#16291f; --g2b:#0f2017; --g2accent:#62c98b;
    --g3a:#2b2416; --g3b:#1d1810; --g3accent:#e3bd6b;
    --g6a:#241f2e; --g6b:#171320; --g6accent:#b9a7f0;
    --g7a:#2a1a1f; --g7b:#1c1015; --g7accent:#f08a9b;
    --g8a:#14282c; --g8b:#0d1a1d; --g8accent:#6fd3d8;
    --divider:rgba(255,255,255,.12);
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --ease:cubic-bezier(.4,1,.75,.9);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(76,144,240,.06), transparent 60%),
      var(--paper);
    color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 28px; gap:38px;
  }

  /* ---- header ---- */
  .head{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
  .brand{display:inline-flex; align-items:center; gap:10px}
  .brand .mk{width:30px; height:30px; border-radius:7px; background:linear-gradient(150deg,#2d72d2,#1c5bb0); display:grid; place-items:center; box-shadow:0 2px 10px rgba(45,114,210,.45)}
  .brand .mk svg{width:16px; height:16px; fill:#fff}
  .brand b{font-size:15px; font-weight:600; letter-spacing:.01em}
  .head h1{font-family:var(--font); font-weight:600; font-size:clamp(28px,4vw,42px); line-height:1.08; letter-spacing:-.02em}
  .head p{font-size:13.5px; color:var(--ink-soft); max-width:440px; line-height:1.5}
  .eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}

  /* ---- group cards ---- */
  .groups{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; width:100%; max-width:830px}
  .group{
    position:relative; overflow:hidden;
    flex:1 1 440px; min-width:300px; max-width:520px; height:312px;
    border-radius:18px; zoom:.5; text-decoration:none; color:inherit;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px rgba(0,0,0,.4);
    border:1px solid var(--divider);
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s var(--ease);
    isolation:isolate;
  }
  .group.g1{background:linear-gradient(155deg,var(--g1a),var(--g1b))}
  .group.g2{background:linear-gradient(155deg,var(--g2a),var(--g2b))}
  .group.g3{background:linear-gradient(155deg,var(--g3a),var(--g3b))}
  .g3 .gtitle .n{color:var(--g3accent)}
  .g3 .gtitle .w,.g3 .gtitle .n{font-size:38px; line-height:1.04}
  .g3 .gpill{background:rgba(227,189,107,.12); color:#f0d79b; box-shadow:inset 0 0 0 1px rgba(227,189,107,.34)}
  .g3 .gpill .dot{background:var(--g3accent); opacity:.8}
  .group.g3{cursor:pointer}
  .group.g3:hover{transform:translateY(-5px); border-color:rgba(227,189,107,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g3:hover .garrow{background:rgba(227,189,107,.9); transform:translateX(3px)}
  .group.g3:hover .garrow svg{fill:#1d1810}
  .group.g3:active{transform:translateY(-2px)}
  /* needle & thread motif */
  .needle{position:absolute; right:8px; top:50%; transform:translateY(-50%) rotate(0deg); width:296px; height:296px; z-index:1;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)); transition:transform .5s var(--ease)}
  .needle .glow{fill:url(#ieGlow)}
  .group.g3:hover .needle{transform:translateY(-50%) rotate(-4deg)}

  .group.g7{background:linear-gradient(155deg,var(--g7a),var(--g7b)); cursor:pointer}
  .g7 .gtitle .w{font-size:42px; line-height:.98}
  .g7 .gtitle .n{color:var(--g7accent); font-size:42px; line-height:1}
  .group.g7:hover{transform:translateY(-5px); border-color:rgba(240,138,155,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g7:hover .garrow{background:rgba(240,138,155,.9); transform:translateX(3px)}
  .group.g7:hover .garrow svg{fill:#1c1015}
  .group.g7:active{transform:translateY(-2px)}
  /* reporting motif */
  .report{position:absolute; right:26px; top:50%; transform:translateY(-50%); width:264px; height:264px; z-index:1;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)); transition:transform .5s var(--ease)}
  .report .glow{fill:url(#rpGlow)}
  .group.g7:hover .report{transform:translateY(-50%) rotate(3deg)}

  .group.g8{background:linear-gradient(155deg,var(--g8a),var(--g8b)); cursor:pointer}
  .g8 .gtitle .w{font-size:42px; line-height:.98}
  .g8 .gtitle .n{color:var(--g8accent); font-size:42px; line-height:1}
  .group.g8:hover{transform:translateY(-5px); border-color:rgba(111,211,216,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g8:hover .garrow{background:rgba(111,211,216,.9); transform:translateX(3px)}
  .group.g8:hover .garrow svg{fill:#0d1a1d}
  .group.g8:active{transform:translateY(-2px)}
  /* laundry motif */
  .drum{position:absolute; right:26px; top:50%; transform:translateY(-50%); width:264px; height:264px; z-index:1;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)); transition:transform .5s var(--ease)}
  .drum .glow{fill:url(#ldGlow)}
  .group.g8:hover .drum{transform:translateY(-50%) rotate(8deg)}

  .group.g6{background:linear-gradient(155deg,var(--g6a),var(--g6b)); cursor:pointer}
  .g6 .gtitle .w{font-size:56px; line-height:.96}
  .g6 .gtitle .n{color:var(--g6accent); font-size:24px; line-height:1.5; letter-spacing:.02em; white-space:nowrap}
  .group.g6:hover{transform:translateY(-5px); border-color:rgba(185,167,240,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g6:hover .garrow{background:rgba(185,167,240,.9); transform:translateX(3px)}
  .group.g6:hover .garrow svg{fill:#171320}
  .group.g6:active{transform:translateY(-2px)}
  /* page-scan motif */
  .scan{position:absolute; right:24px; top:50%; transform:translateY(-50%); width:268px; height:268px; z-index:1;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)); transition:transform .5s var(--ease)}
  .scan .glow{fill:url(#aiGlow)}
  .group.g6:hover .scan{transform:translateY(-50%) rotate(3deg)}

  .gtitle{position:absolute; left:34px; top:50%; transform:translateY(-50%); z-index:3}
  .gtitle .w{display:block; font-family:var(--serif); font-weight:600; color:#fff; font-size:46px; line-height:.96; letter-spacing:.01em; text-shadow:0 2px 14px rgba(0,0,0,.4)}
  .gtitle .n{display:block; font-family:var(--serif); font-weight:600; font-size:46px; line-height:.98; letter-spacing:.01em}
  .g1 .gtitle .n{color:var(--g1accent)}
  .g2 .gtitle .n{color:var(--g2accent)}

  /* status / cta pill, bottom-left */
  .gmeta{position:absolute; left:36px; bottom:26px; z-index:3; display:flex; align-items:center; gap:9px}
  .gpill{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:6px 12px; border-radius:9999px; backdrop-filter:blur(3px)}
  .g2 .gpill{background:rgba(98,201,139,.16); color:#9fe7bd; box-shadow:inset 0 0 0 1px rgba(98,201,139,.4)}
  .g1 .gpill{background:rgba(255,255,255,.07); color:var(--ink-soft); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .gpill .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .g2 .gpill .dot{background:#46d088; box-shadow:0 0 0 3px rgba(70,208,136,.25); animation:pulse 1.6s var(--ease) infinite}
  .g1 .gpill .dot{background:var(--ink-soft)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .garrow{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex:none;
    background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); transition:transform .14s var(--ease), background .14s var(--ease)}
  .garrow svg{width:14px; height:14px; fill:#fff}

  /* hover only for the live (g2) card */
  .group.g2{cursor:pointer}
  .group.g2:hover{transform:translateY(-5px); border-color:rgba(98,201,139,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g2:hover .garrow{background:rgba(98,201,139,.9); transform:translateX(3px)}
  .group.g2:active{transform:translateY(-2px)}
  .g1:hover{transform:translateY(-5px); border-color:rgba(138,187,255,.5); box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 26px 54px rgba(0,0,0,.5)}
  .group.g1:hover .garrow{background:rgba(138,187,255,.9); transform:translateX(3px)}
  .group.g1:active{transform:translateY(-2px)}

  /* ---- scattered brand wordmark collage ---- */
  .collage{position:absolute; right:0; top:0; bottom:0; width:60%; z-index:1}
  .bc{position:absolute; border-radius:11px; display:grid; place-items:center; text-align:center;
    box-shadow:0 10px 22px rgba(0,0,0,.4); padding:0 14px; user-select:none; overflow:hidden}
  .bc.w{background:#fff; color:#15171a}
  .bc.dark{background:#0c0f13; color:#fff}
  .bc.navy{background:#16243d; color:#eaf1ff}
  .bc.olive{background:#9aa040; color:#1a1c10}
  .bc.cream{background:#f3ede1; color:#1a1712}
  .wm{font-weight:700; line-height:1.05; letter-spacing:.02em}
  .wm.up{text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:600}
  .wm.script{font-family:var(--serif); font-style:italic; font-weight:500; letter-spacing:0; font-size:21px}
  .wm.serif{font-family:var(--serif); font-weight:600; letter-spacing:.02em; font-size:18px}
  .wm small{display:block; font-family:var(--font); font-weight:600; font-size:8.5px; letter-spacing:.18em; opacity:.6; margin-top:3px; text-transform:uppercase}

  .foot{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; text-align:center}
  .foot .sep{opacity:.4}

  @media (max-width:520px){
    .gtitle{left:24px} .gmeta{left:26px}
    .collage{width:52%; opacity:.85}
  }
  .qalink{position:fixed; left:14px; bottom:14px; z-index:40; display:inline-flex; align-items:center; gap:6px;
    font:600 11.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; letter-spacing:.06em;
    color:#abb3bf; background:#252a31; padding:8px 12px; border-radius:4px; text-decoration:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 2px 8px rgba(0,0,0,.35)}
  .qalink:hover{background:#2f343c; color:#f6f7f9}
</style>
