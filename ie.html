  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht:50px;padding:0 18px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 1px 12px rgba(0,0,0,0.25)}\n  .nav-home{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit;border-radius:var(--r);margin:0 -4px;padding:4px 6px;transition:background var(--t) var(--ease)}\n  .nav-home:hover{background:rgba(143,153,168,0.10);text-decoration:none}\n  .nav-back{width:0;opacity:0;overflow:hidden;color:var(--mut-2);display:grid;place-items:center;transition:width var(--t) var(--ease),opacity var(--t) var(--ease);flex:none}\n  .nav-home:hover .nav-back{width:16px;opacity:1}\n  .mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;flex:none;background:linear-gradient(180deg,#3a7ddd,var(--blue));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18),0 1px 3px rgba(0,0,0,0.4)}\n  .mark svg{width:18px;height:18px;display:block}\n  .brand-text{display:flex;flex-direction:column;gap:1px;line-height:1.1}\n  .brand-name{font-size:14px;font-weight:600;letter-spacing:-0.01em}\n  .brand-sub{font-size:11px;color:var(--mut-2)}\n  .nav-spacer{flex:1}\n  .nav-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:24px;padding:0 9px;border-radius:var(--r-sm);font-size:11.5px;font-weight:500;color:var(--mut);background:rgba(143,153,168,0.12)}\n  .nav-chip .arrow{color:var(--faint);font-weight:600}\n  .nav-status{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 9px 0 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;letter-spacing:0.03em;color:var(--green-hi);background:rgba(35,133,81,0.16);text-transform:uppercase}\n  .nav-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green-hi);animation:pulse 2s var(--ease) infinite}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(114,202,155,0.45)}70%{box-shadow:0 0 0 5px rgba(114,202,155,0)}100%{box-shadow:0 0 0 0 rgba(114,202,155,0)}}\n\n  .shell{display:flex;align-items:flex-start}\n  .sidebar{position:sticky;top:50px;flex:none;width:248px;height:calc(100vh - 50px);background:var(--surface);box-shadow:1px 0 0 var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}\n  .side-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--faint);padding:6px 10px 8px}\n  .side-item{display:flex;align-items:center;gap:10px;padding:0 10px;height:40px;border-radius:var(--r);color:var(--mut);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;user-select:none;background:none;border:none;font-family:var(--sans);width:100%;text-align:left;transition:background var(--t) var(--ease),color var(--t) var(--ease)}\n  .side-item .ic{color:var(--faint)}\n  .side-item .si-txt{display:flex;flex-direction:column;line-height:1.18;min-width:0}\n  .side-item .si-sub{font-size:10.5px;font-weight:500;color:var(--faint)}\n  .side-item:hover{background:rgba(143,153,168,0.10);color:var(--txt)}\n  .side-item.active{background:rgba(45,114,210,0.16);color:var(--blue-hi)}\n  .side-item.active .ic{color:var(--blue-hi)}\n  .side-item.active .si-sub{color:var(--blue-hi);opacity:0.7}\n  .sb-div{height:1px;background:var(--line);margin:8px 8px}\n  .side-note{padding:8px 10px;font-size:11.5px;color:var(--faint);line-height:1.5}\n  .side-note b{color:var(--mut);font-weight:600}\n  .main{flex:1;min-width:0}\n  .wrap{max-width:1160px;margin:0 auto;padding:24px 22px 56px;display:flex;flex-direction:column;gap:18px}\n  .card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,0.25)}\n\n  .intake{padding:16px}\n  .intake-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}\n  .intake-head .step{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}\n  .intake-head h2{margin:0;font-size:13px;font-weight:600}\n  .intake-head .hint{margin-left:auto;font-size:12px;color:var(--mut-2)}\n  .brandbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}\n  .bb-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--mut-2);white-space:nowrap}\n  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r);background:rgba(143,153,168,0.12)}\n  .seg-i{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border:none;border-radius:var(--r-sm);background:transparent;color:var(--mut);font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}\n  .seg-i:hover{background:rgba(143,153,168,0.14);color:var(--txt)}\n  .seg-i.on{background:var(--surface-3);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,0.3)}\n  .seg-n{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}\n  .seg-i.on .seg-n{color:var(--blue-hi)}\n  .seg-i .caret{color:var(--faint);font-size:9px;line-height:1}\n  .seg-i.on .caret{color:var(--mut)}\n\n  /* thread catalogue */\n  .ovl{position:fixed;inset:0;z-index:60;background:rgba(12,15,19,0.6);display:none;align-items:center;justify-content:center;padding:28px}\n  .ovl.on{display:flex}\n  .dlg{width:min(720px,96vw);max-height:min(78vh,720px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line-strong),0 12px 40px rgba(0,0,0,0.6);overflow:hidden}\n  .dlg-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}\n  .dlg-head .t{font-size:13px;font-weight:600}\n  .dlg-head .s{font-size:11.5px;color:var(--mut-2);white-space:nowrap}\n  .dlg-head .x{margin-left:auto;width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r-sm);border:none;background:transparent;color:var(--mut-2);cursor:pointer;font-size:16px;line-height:1}\n  .dlg-head .x:hover{background:var(--red);color:#fff}\n  .dlg-q{padding:10px 14px;border-bottom:1px solid var(--line)}\n  .dlg-q input{width:100%;height:30px;padding:0 10px;border:none;outline:none;border-radius:var(--r);background:var(--inset);box-shadow:inset 0 0 0 1px var(--line);color:var(--txt);font:inherit;font-size:12.5px}\n  .dlg-q input:focus{box-shadow:inset 0 0 0 1px var(--blue-4),0 0 0 2px rgba(45,114,210,0.25)}\n  .dlg-body{overflow:auto;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}\n  .th{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:var(--r-sm);background:rgba(143,153,168,0.08)}\n  .th .sw{width:26px;height:20px;flex:none}\n  .th .c{font-family:var(--mono);font-size:11.5px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .th .h{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--faint)}\n  .dlg-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);display:flex;gap:10px;align-items:center}\n  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:32px 22px;text-align:center;cursor:pointer;background:var(--inset);transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}\n  .drop:hover{border-color:var(--blue-4);background:#181f2a}\n  .drop.hover{border-color:var(--blue);background:rgba(45,114,210,0.10)}\n  .drop.loaded{border-style:solid;border-color:rgba(114,202,155,0.45);padding:20px 22px}\n  .drop input{display:none}\n  .drop-ico{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(45,114,210,0.14);color:var(--blue-hi);margin-bottom:3px}\n  .drop.loaded .drop-ico{width:34px;height:34px;background:rgba(35,133,81,0.16);color:var(--green-hi)}\n  .drop-ico .ic{width:21px;height:21px}\n  .drop.loaded .drop-ico .ic{width:17px;height:17px}\n  .drop-title{font-size:15px;font-weight:600}\n  .drop-title b{color:var(--blue-hi);font-weight:600}\n  .note{color:var(--mut-2);font-size:12px}\n  .slot-status{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12px;color:var(--mut-2);min-height:22px}\n  .slot-status.ok{color:var(--green-hi)}\n  .slot-status.err{color:var(--red-hi)}\n  .slot-status .nm{font-family:var(--mono);font-size:11.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}\n  .slot-status .sz{flex:none;color:var(--mut-2);font-size:11.5px}\n  .detect{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}\n  .dchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:24px;padding:0 9px;border-radius:var(--r-sm);background:rgba(143,153,168,0.14);color:var(--mut);font-size:11.5px}\n  .dchip b{font-family:var(--mono);font-weight:600;color:var(--txt);font-size:11px}\n  .runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}\n  .runbar .rb-note{font-size:12px;color:var(--faint)}\n  .prog{height:4px;border-radius:999px;background:rgba(143,153,168,0.18);overflow:hidden;display:none;margin-top:12px}\n  .prog.on{display:block}\n  .prog i{display:block;height:100%;width:0;background:var(--blue);transition:width 120ms linear}\n\n  button{font-family:var(--sans)}\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:30px;padding:0 11px;border:none;border-radius:var(--r);background:rgba(143,153,168,0.15);color:var(--txt);font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background var(--t) var(--ease),opacity var(--t) var(--ease)}\n  .btn .ic{color:var(--mut)}\n  .btn:hover:not(:disabled){background:rgba(143,153,168,0.28)}\n  .btn:active:not(:disabled){background:rgba(143,153,168,0.38)}\n  .btn:disabled{background:rgba(143,153,168,0.08);color:var(--mut-2);cursor:not-allowed;opacity:.65}\n  .btn:disabled .ic{color:var(--faint)}\n  .btn.primary{background:var(--blue);color:#fff}\n  .btn.primary .ic{color:rgba(255,255,255,0.9)}\n  .btn.primary:hover:not(:disabled){background:var(--blue-2)}\n  .btn.primary:disabled{background:rgba(45,114,210,0.3);color:rgba(255,255,255,0.55)}\n  .btn.primary:disabled .ic{color:rgba(255,255,255,0.5)}\n  .btn.success{background:var(--green);color:#fff}\n  .btn.success .ic{color:rgba(255,255,255,0.9)}\n  .btn.success:hover:not(:disabled){background:#1c6b42}\n  .btn.danger{background:transparent;color:var(--red-hi);box-shadow:inset 0 0 0 1px rgba(205,66,70,0.4)}\n  .btn.danger .ic{color:var(--red-hi)}\n  .btn.danger:hover:not(:disabled){background:rgba(205,66,70,0.16)}\n\n  .alerts{display:flex;flex-direction:column;gap:10px}\n  .alerts:empty{display:none}\n  .alert{display:flex;gap:11px;padding:13px 15px 14px;border-radius:var(--r-lg);position:relative;overflow:hidden}\n  .alert::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}\n  .alert.err{--ac:var(--red-hi);background:rgba(205,66,70,0.10);box-shadow:inset 0 0 0 1px rgba(250,153,156,0.24)}\n  .alert.warn{--ac:var(--orange-hi);background:rgba(200,118,25,0.10);box-shadow:inset 0 0 0 1px rgba(251,179,96,0.24)}\n  .alert.info{--ac:var(--blue-hi);background:rgba(45,114,210,0.10);box-shadow:inset 0 0 0 1px rgba(138,187,255,0.22)}\n  .alert .a-ico{flex:none;width:17px;height:17px;margin-top:1px;color:var(--ac)}\n  .alert .a-ico svg{width:17px;height:17px;fill:currentColor;display:block}\n  .alert .a-title{font-size:13px;font-weight:650;color:var(--txt);margin:0 0 3px}\n  .alert .a-text{font-size:12.5px;line-height:1.55;color:var(--mut)}\n  .alert code{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:var(--r-sm)}\n\n  .activity{padding:0;overflow:hidden}\n  .activity-head{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}\n  .activity-head .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--mut)}\n  .activity-head .live{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:var(--green-hi);font-weight:600;letter-spacing:0.04em}\n  .activity-head .live .dot{width:6px;height:6px;border-radius:50%;background:var(--green-hi);animation:blink 1.6s steps(1,end) infinite}\n  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}\n  #log{position:relative;margin:0;background:var(--inset);color:var(--mut);font-family:var(--mono);font-size:12px;line-height:1.5;padding:11px 14px;max-height:210px;overflow:auto}\n  #log::before{content:\"\";position:absolute;top:15px;bottom:12px;left:20px;width:1px;background:var(--line)}\n  .tl-row{display:grid;grid-template-columns:13px auto 1fr;align-items:baseline;column-gap:9px;padding:2.5px 0}\n  .tl-rail{justify-self:center;align-self:flex-start;margin-top:5px}\n  .tl-dot{display:block;width:7px;height:7px;border-radius:50%;background:var(--mut-2);box-shadow:0 0 0 3px var(--inset)}\n  .tl-time{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}\n  .tl-msg{font-size:12px;color:var(--mut);white-space:pre-wrap;word-break:break-word}\n  .tl-row.step .tl-dot{background:var(--blue-hi)} .tl-row.step .tl-msg{color:var(--txt)}\n  .tl-row.ok .tl-dot{background:var(--green-hi)} .tl-row.ok .tl-msg{color:var(--green-hi)}\n  .tl-row.warn .tl-dot{background:var(--orange-hi)} .tl-row.warn .tl-msg{color:var(--orange-hi)}\n  .tl-row.err .tl-dot{background:var(--red-hi)} .tl-row.err .tl-msg{color:var(--red-hi)}\n  .tl-row.sub .tl-dot{width:4px;height:4px;margin-left:1.5px;background:var(--faint)} .tl-row.sub .tl-msg{color:var(--mut-2)}\n\n  #results{display:none;flex-direction:column;gap:16px}\n  .results-bar{display:flex;align-items:center;gap:8px}\n  .results-bar .step{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}\n  .results-bar h2{margin:0;font-size:13px;font-weight:600}\n  .results-bar .hint{margin-left:auto;font-size:12px;color:var(--mut-2)}\n  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}\n  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}\n  .kpi{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}\n  .kpi-top{display:flex;align-items:center;gap:7px;color:var(--mut-2);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em}\n  .kpi-top .ic{color:var(--kc,var(--blue))}\n  .kpi-val{font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1;margin-top:9px;font-variant-numeric:tabular-nums}\n  .kpi-sub{font-size:11.5px;color:var(--faint);margin-top:5px}\n\n  .pv{padding:16px;display:flex;flex-direction:column;gap:12px}\n  .pv-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}\n  .pv-head .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--mut-2)}\n  .chipbtn{height:26px;padding:0 10px;border-radius:var(--r-sm);background:rgba(143,153,168,0.14);color:var(--mut);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:none;font-family:var(--sans)}\n  .chipbtn:hover{background:rgba(143,153,168,0.26);color:var(--txt)}\n  .chipbtn.on{background:rgba(45,114,210,0.18);color:var(--blue-hi)}\n  .chipbtn .n{font-variant-numeric:tabular-nums;opacity:.75}\n  .blkchips{display:flex;gap:6px;flex-wrap:wrap;padding-left:9px;border-left:1px solid var(--line)}\n  .blkchips:empty{display:none}\n  .pv-search{margin-left:auto;display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:var(--r);background:var(--inset);box-shadow:ins n    });\n  });\n  master();\n  document.getElementById('brandNote').textContent=MASTER_N.toLocaleString()+' codes · '+CUR.note.replace(/&amp;/g,'&');\n}\n\n/* ============================ ZIP (native, no library) ============================ */\nvar CRC_TABLE=(function(){var t=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();\nfunction crc32(buf){var c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}\nvar TD=new TextDecoder(), TE=new TextEncoder();\nasync function inflateRaw(bytes){\n  var st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));\n  return new Uint8Array(await new Response(st).arrayBuffer());\n}\nasync function deflateRaw(bytes){\n  var st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));\n  return new Uint8Array(await new Response(st).arrayBuffer());\n}\nfunction readZip(buf){\n  var dv=new DataView(buf), u8=new Uint8Array(buf), eocd=-1;\n  for(var i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }\n  if(eocd<0) throw new Error('That file is not a readable .xlsx or .xlsm workbook.');\n  var count=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true);\n  var entries=[], byName={};\n  for(var k=0;k<count;k++){\n    if(dv.getUint32(off,true)!==0x02014b50) throw new Error('The workbook’s zip directory is damaged.');\n    var method=dv.getUint16(off+10,true), time=dv.getUint16(off+12,true), date=dv.getUint16(off+14,true);\n    var crc=dv.getUint32(off+16,true), csize=dv.getUint32(off+20,true), usize=dv.getUint32(off+24,true);\n    var nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true);\n    var lho=dv.getUint32(off+42,true);\n    var name=TD.decode(u8.subarray(off+46,off+46+nl));\n    var lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true), ds=lho+30+lnl+lel;\n    var e={name:name,method:method,time:time,date:date,crc:crc,csize:csize,usize:usize,raw:u8.subarray(ds,ds+csize),data:null};\n    entries.push(e); byName[name]=e;\n    off+=46+nl+el+cl;\n  }\n  return {entries:entries,byName:byName};\n}\nasync function entryText(e){\n  if(!e) return null;\n  if(e.data!=null) return typeof e.data==='string'?e.data:TD.decode(e.data);\n  return e.method===0?TD.decode(e.raw):TD.decode(await inflateRaw(e.raw));\n}\nasync function writeZip(zip){\n  var parts=[], central=[], offset=0;\n  for(var i=0;i<zip.entries.length;i++){\n    var e=zip.entries[i], nameBytes=TE.encode(e.name), utf8=false;\n    for(var b=0;b<nameBytes.length;b++){ if(nameBytes[b]>127){utf8=true;break;} }\n    var method,crc,csize,usize,payload;\n    if(e.data!=null){\n      var plain=typeof e.data==='string'?TE.encode(e.data):e.data;\n      usize=plain.length; crc=crc32(plain);\n      payload=await deflateRaw(plain); method=8; csize=payload.length;\n      if(csize>=usize){ payload=plain; method=0; csize=usize; }\n    }else{ method=e.method; crc=e.crc; csize=e.csize; usize=e.usize; payload=e.raw; }\n    var lh=new Uint8Array(30+nameBytes.length), ldv=new DataView(lh.buffer);\n    ldv.setUint32(0,0x04034b50,true); ldv.setUint16(4,20,true); ldv.setUint16(6,utf8?0x800:0,true);\n    ldv.setUint16(8,method,true); ldv.setUint16(10,e.time,true); ldv.setUint16(12,e.date,true);\n    ldv.setUint32(14,crc,true); ldv.setUint32(18,csize,true); ldv.setUint32(22,usize,true);\n    ldv.setUint16(26,nameBytes.length,true); lh.set(nameBytes,30);\n    parts.push(lh,payload);\n    var ch=new Uint8Array(46+nameBytes.length), cdv=new DataView(ch.buffer);\n    cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true);\n    cdv.setUint16(8,utf8?0x800:0,true); cdv.setUint16(10,method,true);\n    cdv.setUint16(12,e.time,true); cdv.setUint16(14,e.date,true);\n    cdv.setUint32(16,crc,true); cdv.setUint32(20,csize,true); cdv.setUint32(24,usize,true);\n    cdv.setUint16(28,nameBytes.length,true); cdv.setUint32(42,offset,true); ch.set(nameBytes,46);\n    central.push(ch);\n    offset+=lh.length+csize;\n  }\n  var cdSize=0; central.forEach(function(c){cdSize+=c.length;});\n  var end=new Uint8Array(22), edv=new DataView(end.buffer);\n  edv.setUint32(0,0x06054b50,true);\n  edv.setUint16(8,zip.entries.length,true); edv.setUint16(10,zip.entries.length,true);\n  edv.setUint32(12,cdSize,true); edv.setUint32(16,offset,true);\n  return new Blob(parts.concat(central,[end]),{type:'application/octet-stream'});\n}\n\n/* ============================ XLSX HELPERS ============================ */\nfunction cleanCode(v){\n  if(v==null) return '';\n  return String(v).replace(/[\\u00A0\\u200B\\uFEFF]/g,'').trim().replace(/^'+/,'').trim().toUpperCase();\n}\nfunction colIndex(letters){ var n=0; for(var i=0;i<letters.length;i++) n=n*26+(letters.charCodeAt(i)-64); return n; }\nfunction colLetters(n){ var s=''; while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=(n-1-r)/26; } return s; }\nfunction unesc(s){ return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\"').replace(/&apos;/g,\"'\").replace(/&#(\\d+);/g,function(_,d){return String.fromCharCode(+d);}).replace(/&amp;/g,'&'); }\nfunction attr(s,name){ var m=new RegExp(name+'=\"([^\"]*)\"').exec(s); return m?m[1]:null; }\nfunction parseSharedStrings(xml){\n  if(!xml) return [];\n  return (xml.match(/<si\\b[^>]*(?:\\/>|>[\\s\\S]*?<\\/si>)/g)||[]).map(function(si){\n    return unesc((si.match(/<t\\b[^>]*>([\\s\\S]*?)<\\/t>/g)||[]).map(function(t){\n      return t.replace(/<t\\b[^>]*>/,'').replace(/<\\/t>/,'');\n    }).join(''));\n  });\n}\nfunction sectionOf(xml,tag){\n  var m=xml.match(new RegExp('<'+tag+'\\\\b[^>]*(?:/>|>[\\\\s\\\\S]*?<\u002F'+tag+'>)'));\n  return m?m[0]:null;\n}\nfunction splitTags(section,tag){\n  if(!section) return [];\n  return section.replace(/^<[^>]*>/,'').match(new RegExp('<'+tag+'\\\\b[^>]*?(?:/>|>[\\\\s\\\\S]*?<\u002F'+tag+'>)','g'))||[];\n}\nfunction fillRgb(fillStr){\n  if(!fillStr||!/patternType=\"solid\"/.test(fillStr)) return null;\n  var fg=/<fgColor([^>]*)\\/>/.exec(fillStr); if(!fg) return null;\n  var rgb=attr(fg[1],'rgb'); if(!rgb) return null;\n  rgb=rgb.toUpperCase(); if(rgb.length===6) rgb='FF'+rgb;\n  return rgb.length===8?rgb:null;\n}\nvar ROW_RE=/<row\\b([^>]*?)(?:\\/>|>([\\s\\S]*?)<\\/row>)/g;\nvar CELL_RE=/<c r=\"([A-Z]+)(\\d+)\"([^>]*?)(?:\\/>|>([\\s\\S]*?)<\\/c>)/g;\nfunction rowCells(inner,sst){\n  var out={}, m; CELL_RE.lastIndex=0;\n  while((m=CELL_RE.exec(inner||''))){\n    var body=m[4]||'', t=attr(m[3],'t'), v=/<v>([\\s\\S]*?)<\\/v>/.exec(body), text=null;\n    if(v) text = t==='s' ? (sst[+v[1]]!=null?sst[+v[1]]:'') : unesc(v[1]);\n    else if(t==='inlineStr'){ var is=/<t[^>]*>([\\s\\S]*?)<\\/t>/.exec(body); text=is?unesc(is[1]):null; }\n    var s=attr(m[3],'s');\n    out[m[1]]={text:text,style:s==null?null:+s,cell:m[0]};\n  }\n  return out;\n}\nasync function sheetList(zip){\n  var wb=await entryText(zip.byName['xl/workbook.xml']);\n  var rels=await entryText(zip.byName['xl/_rels/workbook.xml.rels'])||'';\n  var relMap={};\n  (rels.match(/<Relationship\\b[^>]*\\/>/g)||[]).forEach(function(r){ relMap[attr(r,'Id')]=attr(r,'Target'); });\n  return (wb.match(/<sheet\\b[^>]*\\/>/g)||[]).map(function(s){\n    var t=(relMap[attr(s,'r:id')]||'worksheets/sheet1.xml').replace(/^\\//,'');\n    return {name:unesc(attr(s,'name')||''), path:t.indexOf('xl/')===0?t:'xl/'+t};\n  });\n}\n\n/* ---------- BLK column detection ---------- */\nvar SYN={\n  blk:[/^BLK$/,/^BLK\\s*(?:NO|NO\\.|#|NUMBER)$/],\n  style:[/^STYLE$/,/^STYLE\\s*\\/?\\s*SFC$/],\n  placement:[/^PLACEMENT$/],\n  quality:[/^QUALITY$/],\n  season:[/^SEASON$/],\n  wash:[/^WASH$/,/^WASH\\s*NAME$/],\n  fabric:[/^FABRIC$/]\n};\nvar CODEISH=[/^CODE\\s*COLOR$/,/^CODE\\s*PP$/,/^THREAD\\s*CODE$/,/^COLOR\\s*CODE$/,/^CODE\\s*NAME$/,/^COLOR\\s*NAME$/,/^COLOR$/,/^CODE$/];\nvar EXPLICIT_CODE=/^(?:CODE\\s*COLOR|CODE\\s*PP|THREAD\\s*CODE|COLOR\\s*CODE)$/;\nvar BLK_LABEL={style:'STYLE',placement:'PLACEMENT',quality:'QUALITY',code:'thread code'};\nfunction normLabel(t){ return (t==null?'':String(t)).replace(/\\s+/g,' ').trim().toUpperCase(); }\nfunction matchAny(list,label){ for(var i=0;i<list.length;i++) if(list[i].test(label)) return true; return false; }\n\n/* master lookup with a one-step fallback: exact code, then the first token */\nfunction lookupCode(MAP,raw){\n  var c=cleanCode(raw);\n  if(!c) return null;\n  if(MAP[c]!==undefined) return {code:c,rgb:MAP[c],loose:false};\n  var t=c.split(' ')[0];\n  if(t&&t!==c&&MAP[t]!==undefined) return {code:t,rgb:MAP[t],loose:true};\n  return null;\n}\n\nfunction detectBlk(sheets,xmls,sst,MAP){\n  var best=null;\n  for(var i=0;i<sheets.length;i++){\n    var xml=xmls[i]; if(!xml) continue;\n    var scanned=0,m; ROW_RE.lastIndex=0;\n    var headers=[];\n    while((m=ROW_RE.exec(xml))&&scanned<15){\n      var rn=+(attr(m[1],'r')||0); if(!rn) continue;\n      scanned++;\n      var cells=rowCells(m[2]||'',sst), cols={}, codeCands=[], hits=0;\n      for(var ref in cells){\n        var t=normLabel(cells[ref].text); if(!t) continue;\n        for(var key in SYN) if(!cols[key]&&matchAny(SYN[key],t)){ cols[key]=ref; hits++; }\n        if(matchAny(CODEISH,t)) codeCands.push({ref:ref,label:t});\n      }\n      if(!cols.placement&&!codeCands.length) continue;\n      /* score every code-ish column by how much of it the master recognises */\n      var scored=scoreCodeColumns(xml,rn,codeCands,sst,MAP);\n      if(!scored.code) continue;\n      var cand={sheet:i,headerRow:rn,cols:cols,code:scored.code,colorName:scored.colorName,\n                rate:scored.rate,hits:hits+2,\n                required:!!(cols.style&&cols.placement&&cols.quality&&scored.code)};\n      if(!best||(cand.required&&!best.required)||\n         (cand.required===best.required&&(cand.rate>best.rate+0.05||(Math.abs(cand.rate-best.rate)<=0.05&&cand.hits>best.hits)))) best=cand;\n    }\n  }\n  return best;\n}\nfunction scoreCodeColumns(xml,headerR th===1?'':'s')+' · '+fmtSize(blob.size);\n    $('nAll').textContent=allRows.length; $('nNf').textContent=countNF;\n    $('outName').textContent=S.outName;\n    $('outMeta').textContent=fmtSize(blob.size)+' · sheets: '+names.join(', ');\n    $('dlBtn').disabled=false;\n    $('detect').innerHTML=\n      '<span class=\"dchip\">Sheet <b>'+escapeHtml(sheet.name)+'<\u002Fb><\u002Fspan>'+\n      '<span class=\"dchip\">Header row <b>'+found.headerRow+'<\u002Fb><\u002Fspan>'+\n      (cols.blk?'<span class=\"dchip\">BLK <b>'+cols.blk+'<\u002Fb><\u002Fspan>':'')+\n      '<span class=\"dchip\">Style <b>'+(cols.style||'—')+'<\u002Fb><\u002Fspan>'+\n      '<span class=\"dchip\">Placement <b>'+(cols.placement||'—')+'<\u002Fb><\u002Fspan>'+\n      '<span class=\"dchip\">Code <b>'+found.code+'<\u002Fb><\u002Fspan>'+\n      (found.colorName?'<span class=\"dchip\">Color name <b>'+found.colorName+'<\u002Fb><\u002Fspan>':'')+\n      '<span class=\"dchip\">Quality <b>'+(cols.quality||'—')+'<\u002Fb><\u002Fspan>';\n    renderChips();\n    renderRows();\n    $('results').style.display='flex';\n\n    if(countNF) alertBox('warn','Not found: '+countNF+' code'+(countNF===1?'':'s'),\n      'Those rows get <code>NOT FOUND<\u002Fcode> in red in column F. Filter the preview by <b>Not found<\u002Fb> to list them.');\n    setTimeout(function(){setProg(null);},600);\n  }catch(err){\n    setProg(null);\n    log('Failed: '+((err&&err.message)||String(err)),'err');\n    alertBox('err','Nothing was built',escapeHtml((err&&err.message)||'Unknown error')+' The BLK file on your disk is untouched.');\n  }\n  $('runBtn').disabled=false; $('clearBtn').disabled=false;\n}\n\n/* ---------- preview ---------- */\nvar CAP=600;\nfunction renderChips(){\n  var wrap=$('blkChips');\n  if(!S.groups||S.groups.length<2){ wrap.innerHTML=''; return; }\n  var html='';\n  for(var i=0;i<S.groups.length;i++){\n    var g=S.groups[i];\n    html+='<button type=\"button\" class=\"chipbtn'+(S.blk===g.blk?' on':'')+'\" data-blk=\"'+escapeHtml(g.blk)+'\">'+escapeHtml(g.blk)+' <span class=\"n\">'+g.rows.length+'<\u002Fspan><\u002Fbutton>';\n  }\n  wrap.innerHTML=html;\n  wrap.querySelectorAll('.chipbtn').forEach(function(b){\n    b.addEventListener('click',function(){\n      var v=b.getAttribute('data-blk');\n      S.blk=(S.blk===v)?'':v;\n      renderChips(); renderRows();\n    });\n  });\n}\nfunction renderRows(){\n  var q=($('q').value||'').trim().toUpperCase();\n  var list=S.rows.filter(function(r){\n    if(S.filter==='nf'&&r.state!=='nf') return false;\n    if(S.blk&&r.blk!==S.blk) return false;\n    if(!q) return true;\n    return r.code.toUpperCase().indexOf(q)>=0||r.style.toUpperCase().indexOf(q)>=0||r.placement.toUpperCase().indexOf(q)>=0||r.blk.toUpperCase().indexOf(q)>=0;\n  });\n  var wrap=$('pvWrap');\n  if(!S.rows.length){ wrap.innerHTML='<div class=\"empty\">Nothing built yet.<\u002Fdiv>'; $('pvNote').textContent=''; return; }\n  if(!list.length){ wrap.innerHTML='<div class=\"empty\">No rows match this filter.<\u002Fdiv>'; $('pvNote').textContent=''; return; }\n  var multi=S.groups&&S.groups.length>1;\n  var shown=list.slice(0,CAP), html=\n    '<table><thead><tr>'+(multi?'<th>Sheet<\u002Fth>':'')+'<th>Style<\u002Fth><th>Placement<\u002Fth><th>Color name<\u002Fth><th>Code<\u002Fth><th>Fill<\u002Fth><th>Hex<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  for(var i=0;i<shown.length;i++){\n    var r=shown[i];\n    var sw=r.rgb?'<span class=\"sw\" style=\"background:#'+r.rgb+'\"><\u002Fspan>':'<span class=\"sw none\"><\u002Fspan>';\n    var tag=r.state==='ok'?'<span class=\"tag ok\">Filled<\u002Fspan>'\n      :r.state==='nf'?'<span class=\"tag nf\">Not found<\u002Fspan>'\n      :'<span class=\"tag empty\">No color<\u002Fspan>';\n    html+='<tr>'+(multi?'<td class=\"mono\">'+escapeHtml(r.blk)+'<\u002Ftd>':'')+\n      '<td class=\"mono\">'+escapeHtml(r.style)+'<\u002Ftd>'+\n      '<td class=\"mono\" style=\"max-width:260px;overflow:hidden;text-overflow:ellipsis\" title=\"'+escapeHtml(r.placement)+'\">'+escapeHtml(r.placement)+'<\u002Ftd>'+\n      '<td class=\"mono\">'+escapeHtml(r.colorName)+'<\u002Ftd><td class=\"mono\">'+escapeHtml(r.code)+'<\u002Ftd>'+\n      '<td>'+sw+'<\u002Ftd><td class=\"mono\">'+(r.rgb?'#'+r.rgb:'—')+'<\u002Ftd><td>'+tag+'<\u002Ftd><\u002Ftr>';\n  }\n  wrap.innerHTML=html+'<\u002Ftbody><\u002Ftable>';\n  $('pvNote').textContent=list.length>CAP\n    ? 'Showing the first '+CAP+' of '+list.length+' rows. Every row is written to the file.'\n    : list.length+' of '+S.rows.length+' rows shown.';\n}\n\n/* ---------- thread colour catalogue ---------- */\nvar CAT_CAP=800;\nfunction openCatalogue(){\n  master();\n  document.getElementById('dlgT').textContent=CUR.label.replace(/&amp;/g,'&');\n  document.getElementById('dlgS').textContent=MASTER_N.toLocaleString()+' thread colors';\n  document.getElementById('ovl').classList.add('on');\n  var q=document.getElementById('dlgQ'); q.value=''; renderCatalogue(); q.focus();\n}\nfunction closeCatalogue(){ document.getElementById('ovl').classList.remove('on'); }\nfunction renderCatalogue(){\n  var map=master(), q=(document.getElementById('dlgQ').value||'').trim().toUpperCase();\n  var keys=Object.keys(map), hits=[];\n  for(var i=0;i<keys.length;i++){\n    var k=keys[i];\n    if(q&&k.indexOf(q)<0&&(map[k]||'').indexOf(q.replace('#',''))<0) continue;\n    hits.push(k);\n    if(hits.length>CAT_CAP&&!q) break;\n  }\n  var shown=hits.slice(0,CAT_CAP), html='';\n  for(var j=0;j<shown.length;j++){\n    var c=shown[j], rgb=map[c];\n    html+='<div class=\"th\">'+(rgb?'<span class=\"sw\" style=\"background:#'+rgb+'\"><\u002Fspan>':'<span class=\"sw none\"><\u002Fspan>')+\n      '<span class=\"c\">'+escapeHtml(c)+'<\u002Fspan><span class=\"h\">'+(rgb?'#'+rgb:'—')+'<\u002Fspan><\u002Fdiv>';\n  }\n  document.getElementById('dlgBody').innerHTML=html||'<div class=\"empty\" style=\"grid-column:1/-1\">No code or hex matches that search.<\u002Fdiv>';\n  document.getElementById('dlgF').textContent = q\n    ? shown.length.toLocaleString()+' match'+(shown.length===1?'':'es')+(hits.length>CAT_CAP?' · showing the first '+CAT_CAP:'')\n    : 'Showing the first '+shown.length.toLocaleString()+' of '+MASTER_N.toLocaleString()+' · search to narrow';\n}\n\n/* ============================ BOOT ============================ */\n$('runBtn').addEventListener('click',run);\n$('clearBtn').addEventListener('click',resetAll);\n$('q').addEventListener('input',renderRows);\n$('fAll').addEventListener('click',function(){ S.filter='all'; $('fAll').classList.add('on'); $('fNf').classList.remove('on'); renderRows(); });\n$('fNf').addEventListener('click',function(){ S.filter='nf'; $('fNf').classList.add('on'); $('fAll').classList.remove('on'); renderRows(); });\n$('dlBtn').addEventListener('click',function(){\n  if(!S.out) return;\n  var url=URL.createObjectURL(S.out), a=document.createElement('a');\n  a.href=url; a.download=S.outName; document.body.appendChild(a); a.click();\n  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);\n  log('Exported '+S.outName,'ok');\n});\n$('dlgX').addEventListener('click',closeCatalogue);\n$('dlgQ').addEventListener('input',renderCatalogue);\n$('ovl').addEventListener('click',function(e){ if(e.target===$('ovl')) closeCatalogue(); });\ndocument.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCatalogue(); });\nif(typeof DecompressionStream==='undefined'||typeof CompressionStream==='undefined'){\n  alertBox('err','This browser cannot open Excel files','It has no built-in zip support. Use a current Chrome, Edge, or Safari.');\n}else{\n  renderBrands();\n  $('sideCount').textContent=MASTER_N.toLocaleString();\n  log('Ready · '+CUR.label.replace(/&amp;/g,'&')+' master has '+MASTER_N.toLocaleString()+' thread codes','step');\n}\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
